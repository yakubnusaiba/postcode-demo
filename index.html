<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusaybah Hub - Postcode Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #0a2463; }
        h2 { color: #0a2463; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
        button { width: 100%; padding: 12px; background: #0a2463; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #d4af37; color: #0a2463; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-size: 14px; }
        .success { background: #e8f5e9; border-left: 4px solid #28a745; color: #155724; }
        .error { background: #ffebee; border-left: 4px solid #dc3545; color: #721c24; }
        .demo-btn { background: #6c757d; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Nusaybah Hub</h2>
    <p>Record Sale & Verify Delivery Address</p>

    <div class="form-group">
        <label>Customer Name</label>
        <input type="text" placeholder="e.g. Aisha Musa" style="text-transform: none; letter-spacing: normal;">
    </div>

    <div class="form-group">
        <label>Customer Postcode (NIPOST)</label>
        <input type="text" id="postcodeInput" placeholder="e.g. FC-02-A09-DB-09" maxlength="17">
    </div>

    <button onclick="verifyPostcode()">Verify Postcode</button>
    <button class="demo-btn" onclick="demoMode()">Use Demo Postcode</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    const API_KEY = "nipost_pk_test_b1323e22b4bf8e4a353d15705b8f2e4181f266a5b9acdb3c";

    async function verifyPostcode() {
        const input = document.getElementById('postcodeInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if(!input) {
            showResult("Please enter a postcode.", "error");
            return;
        }

        // Show loading
        resultBox.style.display = "block";
        resultBox.className = "result-box success";
        resultBox.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Verifying with NIPOST...";

        try {
            const response = await fetch(`https://api.postcode.gov.ng/v1/lookup?postcode=${input}`, {
                method: 'GET',
                headers: {
                    'X-API-Key': API_KEY,
                    'Accept': 'application/json'
                }
            });

            const data = await response.json();

            if (response.ok && data.status !== 'not_found') {
                // Real success
                showResult(`<strong>Verified Address:</strong><br>Postcode: ${input}<br>Status: Valid Structure`, "success");
            } else {
                // If NIPOST test database returns empty
                showResult("Postcode not found in NIPOST test database.", "error");
            }
        } catch (error) {
            showResult("Invalid NIPOST Postcode or Network Error.", "error");
        }
    }

    function demoMode() {
        document.getElementById('postcodeInput').value = "FC-02-A09-DB-09";
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = "block";
        resultBox.className = "result-box success";
        resultBox.innerHTML = `
            <strong>✅ Postcode Verified Successfully</strong><br>
            <strong>State:</strong> Federal Capital Territory (FCT)<br>
            <strong>LGA:</strong> Abuja Municipal<br>
            <strong>District:</strong> Three Arms Zone<br>
            <strong>Building:</strong> 09<br>
            <em style="font-size:12px; color:#666;">Delivery Fee Automated: ₦2,500</em>
        `;
    }

    function showResult(msg, type) {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = "block";
        resultBox.className = `result-box ${type}`;
        resultBox.innerHTML = msg;
    }
</script>

</body>
  </html>
